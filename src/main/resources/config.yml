armor: true
debug: false
debug_level: ERROR
dont_spam_chat: false
enderchest: true
no_creative_pvp: false
no_drops: false
no_falling_drops: false
no_pickups: false
no_villager_trade: false
no_wither_spawn: false
no_golem_spawn: false
remove_potions: true
restrict_creative: false
# Allow creative players to break non-empty containers while restrict_creative is enabled.
# Uses normal Minecraft drops; set no_pickups: true to block item pickup in creative.
# Container copying and pre-filled placement restrictions remain enabled.
allow_creative_container_break: false
# Automatically add future default containers after the first migration.
# Existing configs first receive commented suggestions: run /gmi auto-update-container-config to include all defaults and enable updates.
# To skip the current migration and disable automatic updates: /gmi auto-update-container-config false
# Set to false to keep your list unchanged and review future updates manually.
auto_update_containers: true
# Managed by the plugin; leave this value unchanged.
containers_version: 1
