save_on_death: true
survival_on_world_change: false
xp: true
track_creative_place:
  enabled: false
  break_no_drop: false
  no_piston_move: false
  attached_block: false
  no_seeds_from_pumpkin: false
  worlds:
    - world
  dont_track:
    - STONE
    - DIRT
  dont_track_is_whitelist: false
creative_blacklist: false
blacklist:
  - TNT
  - BEDROCK
  - LAVA_BUCKET
  - ARMOR_STAND
break_bedrock: false
command_blacklist: false
commands:
  - give
  - i
  - buy
  - sell
restrict_spectator: false
bypass:
  inventories: true
  # These switches allow OPs / gamemodeinventories.bypass holders to bypass each protection.
  # Individual gamemodeinventories.bypass.container-* permissions bypass it independently.
  container-copy: false
  container-place: false
  container-break: false
  items: true
  blacklist: false
  survival: false
  commands: false
  trades: false
uuid_conversion_done: true
blocks_conversion_done: true
xp_conversion_done: true
storage:
  mysql:
    server: localhost
    port: 3306
    database: GMI
    user: bukkit
    password: mysecurepassword
    pool_size: 10
    test_connection: false
    useSSL: true
  database: sqlite
  prefix: ''
creative_world:
  location: last_known
  world: creative
  switch_to: false
